# DHCP/DNS failover for Pi-hole on a WT32-ETH01 (ESP32 + LAN8720 Ethernet).
substitutions:
  name: esp32-dhcp
  friendly_name: DHCP Failover

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # WT32-ETH01 boards ship with rev3.x ESP32 chips. Remove these on older (rev<3) chips.
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

external_components:
  - source: github://loucks1/DHCP-Failover-ESPHome
    components: [dhcp_failover]

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_EXT_IN
    pin: GPIO0
  phy_addr: 1
  power_pin: GPIO16
  manual_ip:
    static_ip: 192.168.86.11
    gateway: 192.168.86.1
    subnet: 255.255.255.0
    dns1: 192.168.86.10
    dns2: 1.1.1.1

logger:

api:
  reboot_timeout: 0s  # a failover box must not reboot just because HA is unreachable
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key   # same key as api; must match

web_server:   # optional
  port: 80

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    servers: [pool.ntp.org, time.cloudflare.com, 162.159.200.1]

dhcp_failover:
  time_id: sntp_time
  address: 192.168.86.11            # must equal ethernet static_ip
  pihole_ip: 192.168.86.10
  # pihole_port: 80        # Pi-hole v6 web/API port; often 8080 when another web server owns :80
  pihole_password: !secret pihole_app_password
  gateway: 192.168.86.1
  netmask: 255.255.255.0
  pool_start: 192.168.86.210
  pool_end: 192.168.86.249
  lease_time: 10min
  domain: lan
  upstream_dns: [1.1.1.1, 9.9.9.9]
  probe_mode: dns           # health check = DNS query sent straight to Pi-hole (or: dhcp)
  probe_dns_name: proxmox1.lan   # a name Pi-hole always answers locally
  # probe_dns_server: 192.168.86.10   # defaults to pihole_ip; never this device
  # probe_dns_timeout: 2s
  probe_interval_min: 60s   # while healthy, each probe waits a random time in [min, max]
  probe_interval_max: 120s
  probe_retry_interval: 5s  # after a failed probe, and the whole time we're active
  fail_threshold: 2         # failed probes in a row -> active
  recover_threshold: 2      # good probes in a row -> passive again
  sync_time: "03:30"
  # Entities (all optional; defaults shown)
  mode: { name: Mode }
  override: { name: Override }
  pihole_dhcp_healthy: { name: Pi-hole DHCP Healthy }   # name kept for compatibility; follows the probe in either mode
  reservation_count: { name: Reservations }
  active_lease_count: { name: Active Leases }
  last_sync: { name: Last Sync }
  sync_status: { name: Sync Status }
  sync_now: { name: Sync Now }
