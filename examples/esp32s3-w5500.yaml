# DHCP/DNS failover on an ESP32-S3 with a W5500 SPI Ethernet module (pins are PLACEHOLDERS).
substitutions:
  name: esp32-dhcp
  friendly_name: DHCP Failover

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

external_components:
  - source: github://loucks1/DHCP-Failover-ESPHome
    components: [dhcp_failover]

ethernet:
  type: W5500
  clk_pin: GPIO12     # PLACEHOLDER
  mosi_pin: GPIO11    # PLACEHOLDER
  miso_pin: GPIO13    # PLACEHOLDER
  cs_pin: GPIO10      # PLACEHOLDER
  interrupt_pin: GPIO4  # PLACEHOLDER
  reset_pin: GPIO5    # PLACEHOLDER
  manual_ip:
    static_ip: 192.168.86.11
    gateway: 192.168.86.1
    subnet: 255.255.255.0
    dns1: 192.168.86.10
    dns2: 1.1.1.1

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key   # same key as api; must match

web_server:   # optional
  port: 80

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    servers: [pool.ntp.org, time.cloudflare.com, 162.159.200.1]

dhcp_failover:
  time_id: sntp_time
  address: 192.168.86.11            # must equal ethernet static_ip
  pihole_ip: 192.168.86.10
  # pihole_port: 80        # Pi-hole v6 web/API port; often 8080 when another web server owns :80
  pihole_password: !secret pihole_app_password
  gateway: 192.168.86.1
  netmask: 255.255.255.0
  pool_start: 192.168.86.210
  pool_end: 192.168.86.249
  lease_time: 10min
  domain: lan
  upstream_dns: [1.1.1.1, 9.9.9.9]
  probe_interval_min: 60s   # each probe waits a random time in [min, max]
  probe_interval_max: 120s
  fail_threshold: 4
  recover_threshold: 3
  sync_time: "03:30"
  # Entities (all optional; defaults shown)
  mode: { name: Mode }
  override: { name: Override }
  pihole_dhcp_healthy: { name: Pi-hole DHCP Healthy }
  reservation_count: { name: Reservations }
  active_lease_count: { name: Active Leases }
  last_sync: { name: Last Sync }
  sync_status: { name: Sync Status }
  sync_now: { name: Sync Now }
